      - name: Fix release signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          start = s.find("signingConfigs {")
          if start == -1:
              raise SystemExit("signingConfigs not found")

          open_brace = s.find("{", start)
          depth = 0
          close_brace = None

          for i in range(open_brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break

          if close_brace is None:
              raise SystemExit("signingConfigs closing brace not found")

          release_config = '''
              release {
                  storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          '''

          s = s[:close_brace] + release_config + s[close_brace:]

          build_start = s.find("buildTypes {")
          if build_start == -1:
              raise SystemExit("buildTypes not found")

          release_start = s.find("release {", build_start)
          if release_start == -1:
              raise SystemExit("release buildType not found")

          next_section = s.find("}", release_start)

          section = s[release_start:next_section]

          if "signingConfig signingConfigs.debug" in section:
              section = section.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )
          elif "signingConfig signingConfigs.release" not in section:
              section = section.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.release",
                  1
              )

          s = s[:release_start] + section + s[next_section:]

          p.write_text(s)

          print("RELEASE SIGNING CONFIGURED")
          PY

          grep -nE "signingConfigs|signingConfig|storeFile|keyAlias" android/app/build.gradle
