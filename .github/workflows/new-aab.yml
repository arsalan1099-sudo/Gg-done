name: Go Bharat Correct Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Correct Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode correct Play keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .github-signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .github-signing/upload.jks

      - name: Verify correct key before build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SHA1=$(keytool -list -v \
            -keystore .github-signing/upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | awk '/SHA1:/{print $2; exit}')

          echo "Keystore SHA1: $SHA1"

          test "$SHA1" = "4F:68:A1:0F:E3:F5:3A:8C:A8:44:9F:C0:96:26:69:B8:81:22:03:E1"

      - name: Generate Android project
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Configure release signing
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$((100000 + VERSION_CODE))

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          marker = "    buildTypes {"

          if marker not in s:
              raise SystemExit("buildTypes block not found")

          release_signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''

          s = s.replace(marker, release_signing + marker, 1)

          build_pos = s.index(marker)
          before = s[:build_pos]
          after = s[build_pos:]

          release_pos = after.find("release {")
          if release_pos == -1:
              raise SystemExit("release buildType not found")

          head = after[:release_pos]
          tail = after[release_pos:]

          if "signingConfig signingConfigs.debug" in tail:
              tail = tail.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
                  1
              )
          else:
              tail = tail.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.release",
                  1
              )

          s = before + head + tail

          version_code = os.environ["VERSION_CODE"]
          s, count = re.subn(
              r'\bversionCode\s+\d+',
              f'versionCode {version_code}',
              s,
              count=1
          )

          if count == 0:
              raise SystemExit("versionCode not found")

          p.write_text(s)

          print("Release signing configured.")
          print("Version code:", version_code)
          PY

      - name: Build release AAB with correct key
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.github-signing/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Prepare final AAB
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab ./Go-Bharat.aab
          ls -lh ./Go-Bharat.aab

      - name: Verify FINAL AAB signing certificate
        run: |
          SHA1=$(keytool -printcert -jarfile ./Go-Bharat.aab \
            | awk '/SHA1:/{print $2; exit}')

          EXPECTED="4F:68:A1:0F:E3:F5:3A:8C:A8:44:9F:C0:96:26:69:B8:81:22:03:E1"

          echo "FINAL AAB SHA1: $SHA1"

          if [ "$SHA1" != "$EXPECTED" ]; then
            echo "ERROR: Wrong signing certificate"
            exit 1
          fi

          echo "CORRECT PLAY STORE SIGNING KEY CONFIRMED"

      - name: Upload final AAB
        uses: actions/upload-artifact@v4
        with:
          name: Go-Bharat-PlayStore-AAB
          path: ./Go-Bharat.aab
          if-no-files-found: error
          retention-days: 7
