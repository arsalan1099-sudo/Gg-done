name: Go Bharat Correct Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode Play keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .github-signing
          echo "$KEYSTORE_B64" | base64 --decode > .github-signing/upload.jks

      - name: Verify keystore
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SHA1=$(keytool -list -v \
            -keystore .github-signing/upload.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" | awk '/SHA1:/{print $2; exit}')

          echo "Keystore SHA1: $SHA1"

          test "$SHA1" = "4F:68:A1:0F:E3:F5:3A:8C:A8:44:9F:C0:96:26:69:B8:81:22:03:E1"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Fix release signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          debug_block = """        debug {
              storeFile file('debug.keystore')
              storePassword 'android'
              keyAlias 'androiddebugkey'
              keyPassword 'android'
          }"""

          release_block = debug_block + """
          release {
              storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
              storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
              keyAlias System.getenv("ANDROID_KEY_ALIAS")
              keyPassword System.getenv("ANDROID_KEY_PASSWORD")
          }"""

          if debug_block not in s:
              raise SystemExit("debug signing block not found")

          s = s.replace(debug_block, release_block, 1)

          if "signingConfig signingConfigs.debug" not in s:
              raise SystemExit("release signing line not found")

          pos = s.rfind("signingConfig signingConfigs.debug")
          s = (
              s[:pos]
              + "signingConfig signingConfigs.release"
              + s[pos + len("signingConfig signingConfigs.debug"):]
          )

          p.write_text(s)
          print("Release signing patched")
          PY

          grep -nE "signingConfigs|signingConfig|storeFile" android/app/build.gradle

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.github-signing/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify final AAB
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Go-Bharat.aab

          SHA1=$(keytool -printcert -jarfile Go-Bharat.aab \
            | awk '/SHA1:/{print $2; exit}')

          echo "FINAL AAB SHA1: $SHA1"

          test "$SHA1" = "4F:68:A1:0F:E3:F5:3A:8C:A8:44:9F:C0:96:26:69:B8:81:22:03:E1"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Go-Bharat-PlayStore-AAB
          path: Go-Bharat.aab
          if-no-files-found: error
