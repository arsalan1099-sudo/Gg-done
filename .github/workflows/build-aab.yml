name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android AAB
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > build.json

      - name: Get build ID
        run: |
          node <<'NODE'
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync('build.json', 'utf8')
          );

          const builds = Array.isArray(data) ? data : [data];

          const build = builds.find(
            b => b.id
          );

          if (!build) {
            console.error('Build ID not found.');
            console.error(data);
            process.exit(1);
          }

          console.log('Build ID:', build.id);

          fs.writeFileSync(
            'build-id.txt',
            build.id
          );
          NODE

      - name: Download AAB
        run: |
          mkdir -p output

          BUILD_ID=$(cat build-id.txt)

          eas build:download \
            --build-id "$BUILD_ID" \
            --non-interactive

          AAB=$(find . -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB file not found."
            find . -type f | grep -E '\.(aab|apk)$' || true
            exit 1
          fi

          echo "AAB found: $AAB"

          cp "$AAB" output/Go-Bharat.aab

      - name: Verify AAB
        run: |
          if [ ! -f "output/Go-Bharat.aab" ]; then
            echo "ERROR: Go-Bharat.aab was not created."
            exit 1
          fi

          echo "AAB created successfully:"
          ls -lh output/Go-Bharat.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Go-Bharat-AAB
          path: output/Go-Bharat.aab
          if-no-files-found: error
          retention-days: 7
