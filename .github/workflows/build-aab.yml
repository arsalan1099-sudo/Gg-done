name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo/EAS
        run: npm install -g eas-cli

      - name: Verify app configuration
        run: |
          echo "Checking app configuration..."
          node -e "const a=require('./app.json'); console.log('Package:', a.expo.android.package); console.log('Version:', a.expo.version); console.log('Version Code:', a.expo.android.versionCode)"

      - name: Build Android AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --clear-cache \
            --wait

      - name: Download AAB
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p dist
          eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json > build.json

          node - <<'NODE'
          const fs = require('fs');
          const builds = JSON.parse(fs.readFileSync('build.json', 'utf8'));
          const build = builds[0];

          if (!build || !build.artifacts || !build.artifacts.buildUrl) {
            throw new Error('Finished AAB URL not found');
          }

          console.log('Downloading AAB...');
          console.log(build.artifacts.buildUrl);
          NODE

          curl -L "$(node -e "const b=require('./build.json')[0]; console.log(b.artifacts.buildUrl)")" \
            -o dist/Go-Bharat.aab

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Go-Bharat-AAB
          path: dist/Go-Bharat.aab
          retention-days: 7
