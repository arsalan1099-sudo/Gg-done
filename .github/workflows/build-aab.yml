name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      npm_config_registry: https://registry.npmjs.org/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Fix package-lock
        run: |
          if [ -f package-lock.json ]; then
            sed -i 's#https\?://package-firewall\.replit\.local/npm/#https://registry.npmjs.org/#g' package-lock.json
            sed -i 's#https\?://package-firewall\.replit\.local#https://registry.npmjs.org#g' package-lock.json
          fi

          if grep -q "package-firewall.replit.local" package-lock.json 2>/dev/null; then
            echo "Replit URL still exists"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci \
            --registry=https://registry.npmjs.org/ \
            --fetch-retries=5 \
            --fetch-retry-mintimeout=20000 \
            --fetch-retry-maxtimeout=120000 \
            --no-audit \
            --no-fund

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait

      - name: Download AAB
        run: |
          eas build:download \
            --platform android \
            --latest \
            --output ./Go-Bharat.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Go-Bharat-AAB
          path: ./Go-Bharat.aab
