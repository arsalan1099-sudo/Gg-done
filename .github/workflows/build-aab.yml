name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fix Replit package URLs
        run: |
          if [ -f package-lock.json ]; then
            sed -E -i 's#https?://package-firewall\.replit\.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          fi
          if [ -f package.json ]; then
            sed -E -i 's#https?://package-firewall\.replit\.local/npm/#https://registry.npmjs.org/#g' package.json
          fi

          if grep -R "package-firewall\.replit\.local" package-lock.json package.json 2>/dev/null; then
            echo "ERROR: Replit package URL still exists."
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --no-audit --no-fund

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Download AAB
        run: eas build:download --platform android --latest --output ./Go-Bharat.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Go-Bharat-AAB
          path: ./Go-Bharat.aab
