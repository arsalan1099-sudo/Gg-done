name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Download AAB
        run: eas build:download --platform android --latest --output ./Go-Bharat.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Go-Bharat-AAB
          path: ./Go-Bharat.aab
