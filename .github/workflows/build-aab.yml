name: FREE Android AAB Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build AAB locally on GitHub
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./Go-Bharat.aab

      - name: Verify AAB
        run: |
          test -f Go-Bharat.aab
          ls -lh Go-Bharat.aab
          keytool -printcert -jarfile Go-Bharat.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Go-Bharat-AAB
          path: Go-Bharat.aab
          if-no-files-found: error
          retention-days: 7
