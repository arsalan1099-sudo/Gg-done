name: Unpack Go Bharat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q go-bharat-free-hosting-2.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted
          rm -f go-bharat-free-hosting-2.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Go Bharat for free hosting" || echo "Nothing to commit"
          git push
