name: Go Saudi Premium Standalone APK
on:
  push:
    branches: [go-saudi]
    paths:
      - '.github/workflows/go-saudi-apk.yml'
      - 'app/index.tsx'
      - 'components/saudi/**'
      - 'lib/saudiCategories.ts'
      - 'lib/saudiCart.ts'
      - 'package.json'
      - 'app.json'
      - 'scripts/generate-saudi-brand.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_PUBLIC_SAUDI_API_URL: ""
      EXPO_PUBLIC_SAUDI_STAGE: PRELAUNCH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci --no-audit --no-fund
      - run: npm run test:saudi:mobile
      - name: Generate original Saudi-only app icons and splash
        run: npm run brand:saudi
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release-mode testing APK (not Play Store)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Verify signed APK includes its own JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/Go-Saudi-Testing.apk
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs apk-output/Go-Saudi-Testing.apk > apk-output/signature.txt
          "$SDK_TOOLS/aapt" dump badging apk-output/Go-Saudi-Testing.apk > apk-output/manifest.txt
          grep -q "package: name='com.aasaa.gosaudi'" apk-output/manifest.txt
          grep -q "targetSdkVersion:'36'" apk-output/manifest.txt
          unzip -Z1 apk-output/Go-Saudi-Testing.apk > /tmp/go-saudi-apk-files.txt
          grep -Fxq 'assets/index.android.bundle' /tmp/go-saudi-apk-files.txt
          sha256sum apk-output/Go-Saudi-Testing.apk > apk-output/SHA256SUMS.txt
          echo "Go Saudi premium native UI, independent GS icon, Arabic/English, 109 categories, version as recorded in APK manifest. Only real verified merchant listings are shown, commercial checkout is disabled. ARM64 test-signing only; NOT Play Store release." > apk-output/READ-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Go-Saudi-Testing-APK
          path: apk-output/
          retention-days: 14
          if-no-files-found: error
