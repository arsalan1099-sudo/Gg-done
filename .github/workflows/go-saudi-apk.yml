name: Go Saudi standalone testing APK — local shopping demo
on:
  push:
    branches: [go-saudi]
    paths:
      - '.github/workflows/go-saudi-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_PUBLIC_SAUDI_API_URL: ""
      EXPO_PUBLIC_SAUDI_STAGE: PRELAUNCH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci --no-audit --no-fund
      - run: npm run test:saudi:mobile
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release-mode testing APK (NOT Google Play store release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/Go-Saudi-Testing.apk
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs apk-output/Go-Saudi-Testing.apk > apk-output/signature.txt
          "$SDK_TOOLS/aapt" dump badging apk-output/Go-Saudi-Testing.apk > apk-output/manifest.txt
          grep -q "package: name='com.aasaa.gosaudi'" apk-output/manifest.txt
          # Standalone release-mode builds must ship bundled JS, not Metro dev server.
          grep -q "targetSdkVersion:'36'" apk-output/manifest.txt
          unzip -p apk-output/Go-Saudi-Testing.apk assets/index.android.bundle | head -c 4 | od -An -tx1 >/tmp/go-saudi-js-header
          test -s /tmp/go-saudi-js-header
          sha256sum apk-output/Go-Saudi-Testing.apk > apk-output/SHA256SUMS.txt
          printf '%s\n' 'Go Saudi PRELAUNCH standalone testing APK, arm64 Android only, release-mode bundled JavaScript with test/debug signing key. Arabic/English shopping demo: product search, categories, wishlist and local cart. Demo products are not for sale. Vendor enquiries require an approved Saudi backend/privacy configuration. Real checkout, orders and payments are disabled. Not Play Store publication; test only. Real-device QA still required.' > apk-output/READ-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Go-Saudi-Testing-APK
          path: apk-output/
          retention-days: 14
          if-no-files-found: error
