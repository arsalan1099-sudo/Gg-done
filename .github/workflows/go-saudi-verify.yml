name: Go Saudi - Preview Verification

on:
  push:
    branches: [go-saudi]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:saudi
      - run: npm run test:revenue
      - run: npm run server:build
      # Focused type-check: the inherited Go Bharat repository has existing
      # unrelated full-project TS failures (mockup sandbox, legacy modules).
      - run: npx tsc --noEmit --strict --skipLibCheck --esModuleInterop --target ES2022 --module commonjs --moduleResolution node --types node server/saudiAdminAuth.ts server/saudiAdminRules.ts
      - run: npx expo export --platform web --output-dir static-build
