name: Go Saudi - Secure Preview Release Verification

on:
  push:
    branches: [go-saudi]
  workflow_dispatch:

jobs:
  vendor-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saudi_ci
          POSTGRES_PASSWORD: saudi_ci_only
          POSTGRES_DB: go_saudi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saudi_ci -d go_saudi_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://saudi_ci:saudi_ci_only@localhost:5432/go_saudi_ci
      GO_SAUDI_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:saudi:migrate
      - run: npm run test:saudi
      - run: npm run test:saudi:mobile
      - run: npm run test:revenue
      - run: npm run test:saudi:integration
      - name: Saudi migration must reject a mixed-market database
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {Client}=require('pg');
          (async()=>{
            const c=new Client({connectionString:process.env.DATABASE_URL});
            await c.connect();
            await c.query('CREATE TABLE foreign_market_sentinel (id int PRIMARY KEY)');
            await c.end();
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          if npm run db:saudi:migrate > /tmp/saudi-migration-guard.log 2>&1; then
            echo "ERROR: migration accepted a mixed-market database" >&2
            exit 1
          fi
          node - <<'NODE'
          const {Client}=require('pg');
          (async()=>{
            const c=new Client({connectionString:process.env.DATABASE_URL});
            await c.connect();
            await c.query('DROP TABLE foreign_market_sentinel');
            await c.end();
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          npm run db:saudi:migrate
      - name: Saudi PostgreSQL backup and restore drill (disposable CI data)
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=saudi_ci_only
          # The GitHub host may have PostgreSQL 17/18 clients. Use the matching
          # PostgreSQL 16 container image already pulled for the test database.
          docker run --rm --network host -e PGPASSWORD=saudi_ci_only postgres:16 \
            pg_dump -h 127.0.0.1 -U saudi_ci -d go_saudi_ci \
            --format=custom --no-owner --no-acl > /tmp/go-saudi-ci.backup
          test -s /tmp/go-saudi-ci.backup
          createdb -h localhost -U saudi_ci go_saudi_restore
          docker run --rm --network host -e PGPASSWORD=saudi_ci_only \
            -v /tmp:/backup:ro postgres:16 \
            pg_restore -h 127.0.0.1 -U saudi_ci -d go_saudi_restore \
            --no-owner --no-acl /backup/go-saudi-ci.backup
          marker="$(psql postgresql://saudi_ci:saudi_ci_only@localhost:5432/go_saudi_restore -Atqc \
            "SELECT market || ':' || schema_version FROM saudi_market_metadata")"
          test "$marker" = "go-saudi:5"
          test "$(psql postgresql://saudi_ci:saudi_ci_only@localhost:5432/go_saudi_restore -Atqc \
            "SELECT count(*) FROM saudi_vendor_data_requests WHERE status='COMPLETED'")" -ge 1
          test "$(psql postgresql://saudi_ci:saudi_ci_only@localhost:5432/go_saudi_restore -Atqc \
            "SELECT count(*) FROM saudi_vendor_draft_products")" -ge 1
      - run: npm run server:build
      - name: Export Saudi Android and iOS JavaScript bundles (unsigned, no store upload)
        env:
          EXPO_PUBLIC_SAUDI_API_URL: ""
          EXPO_PUBLIC_SAUDI_STAGE: PRELAUNCH
        run: npx expo export --platform all --output-dir static-build
      - name: Focused Saudi TypeScript verification
        run: npx tsc --noEmit --strict --skipLibCheck --esModuleInterop --target ES2022 --module commonjs --moduleResolution node --types node server/saudiAdminAuth.ts server/saudiAdminRules.ts server/saudiVendorRules.ts server/saudiCsp.ts
      - name: Production-mode smoke (isolated Saudi server only)
        shell: bash
        run: |
          set -euo pipefail
          export GO_SAUDI_ADMIN_TOKEN_SHA256="$(node -e "const c=require('crypto');console.log(c.createHash('sha256').update('c'.repeat(64)).digest('hex'))")"
          export APP_PUBLIC_URL="https://go-saudi-ci.example"
          export NODE_ENV="production"
          export PORT=5011
          node server_dist/saudiServer.mjs > /tmp/go-saudi-boot.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5011/api/health > /tmp/go-saudi-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/go-saudi-boot.log; exit 1; fi
          grep -q '"status":"healthy"' /tmp/go-saudi-health.json
          curl -sf http://127.0.0.1:5011/api/saudi/market | grep -q '"PRELAUNCH"'
          curl -sf http://127.0.0.1:5011/api/saudi/readiness > /tmp/go-saudi-readiness.json
          node - <<'NODE'
          const r=require('/tmp/go-saudi-readiness.json');
          if(r.commercialLaunchReady!==false||r.livePayments!==false||
             r.liveOrders!==false||r.publicProducts!==false||
             r.technicalConfiguration?.sellerEnquiriesOpen!==false){
            throw Error('Saudi commercial or seller-privacy gate incorrectly open');
          }
          NODE
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"businessName":"Demo Seller","city":"Jeddah","category":"Food","phone":"0551234567","consent":true}' \
            http://127.0.0.1:5011/api/saudi/seller-enquiries)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"inviteToken":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' \
            -H 'Origin: https://attacker.example' \
            http://127.0.0.1:5011/api/saudi/vendor/activate)" = "403"

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5011/api/vendors)" = "423"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5011/vendor)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5011/admin)" = "302"
