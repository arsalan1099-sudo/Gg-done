name: Go Saudi - Preview Verification

on:
  push:
    branches: [go-saudi]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:saudi
      - run: npm run test:revenue
      - run: npm run server:build
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir static-build
