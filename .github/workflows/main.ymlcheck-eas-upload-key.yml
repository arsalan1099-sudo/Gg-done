- name: Find exact Android build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Searching EAS Android builds..."

          eas build:list \
            --platform android \
            --status finished \
            --limit 10 \
            --json > build.json

          node <<'NODE'
          const fs = require('fs');

          const data = JSON.parse(fs.readFileSync('build.json', 'utf8'));
          const builds = Array.isArray(data) ? data : (data.builds || []);

          const matches = builds.filter(b =>
            b.appIdentifier === 'com.median.android.odmalem' &&
            String(b.appBuildVersion) === '19'
          );

          if (!matches.length) {
            console.error('No matching Android build found.');
            console.log('Available builds:');

            builds.forEach(b => {
              console.log(
                b.id,
                b.appIdentifier,
                b.appBuildVersion
              );
            });

            process.exit(1);
          }

          const b = matches[0];

          console.log('MATCHING BUILD FOUND');
          console.log('Build ID:', b.id);
          console.log('Package:', b.appIdentifier);
          console.log('Version:', b.appBuildVersion);

          fs.writeFileSync('build-id.txt', b.id);
          NODE
