name: Free-tier readiness checks

on:
  pull_request:
    paths:
      - "scripts/check-production-env.mjs"
      - "scripts/__tests__/**"
      - "server/**"
      - "shared/**"
      - "package*.json"
      - ".github/workflows/free-dev-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check readiness script
        run: node --test scripts/__tests__/check-production-env.test.mjs
      - name: Check revenue rules
        run: npm run test:revenue
      - name: Build API bundle
        run: npm run server:build
