# GO SAUDI PRELAUNCH only: deploy after isolated database migration and verified Saudi privacy / hosting review.
# Separate Saudi preview service. Never point DATABASE_URL to Go Bharat's database.
services:
  - type: web
    name: go-saudi-preview
    runtime: node
    plan: free
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GO_SAUDI_MODE
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: VENDOR_MEMBERSHIP_PAYMENTS_ENABLED
        value: "false"
      - key: GO_SAUDI_PRIVACY_APPROVED
        value: "false"
      - key: GO_SAUDI_ACCOUNT_ERASURE_ENABLED
        value: "false"
      - key: GO_SAUDI_CATALOG_PUBLIC
        value: "false"
      - key: GO_SAUDI_MARKETPLACE_LAUNCH_APPROVED
        value: "false"
      - key: GO_SAUDI_MERCHANT_VERIFICATION_APPROVED
        value: "false"
      - key: GO_SAUDI_ESTORE_VERIFIED
        value: "false"
      - key: GO_SAUDI_CUSTOMER_OTP_ENABLED
        value: "false"
      - key: GO_SAUDI_CUSTOMER_DATA_RIGHTS_READY
        value: "false"
      - key: GO_SAUDI_ORDER_OPERATIONAL_TESTS_PASSED
        value: "false"
      - key: GO_SAUDI_FULFILLMENT_READY
        value: "false"
      - key: GO_SAUDI_ZATCA_READY
        value: "false"
      - key: GO_SAUDI_REFUNDS_READY
        value: "false"
      - key: GO_SAUDI_SETTLEMENT_RECONCILIATION_READY
        value: "false"
      - key: GO_SAUDI_LIVE_CHARGES_APPROVED
        value: "false"
      - key: GO_SAUDI_ORDERS_ENABLED
        value: "false"
      - key: GO_SAUDI_BOOKINGS_ENABLED
        value: "false"
      - key: GO_SAUDI_PAYMENTS_ENABLED
        value: "false"
      - key: GO_SAUDI_SERVICE_BOOKINGS_LICENSED
        value: "false"
      - key: GO_SAUDI_PAYMENT_WEBHOOK_READY
        value: "false"
      - key: GO_SAUDI_VENDOR_SETTLEMENT_READY
        value: "false"
      - key: GO_SAUDI_REGULATED_CATEGORY_REVIEW_READY
        value: "false"
      - key: GO_SAUDI_ADMIN_TOKEN_SHA256
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: MOYASAR_SECRET_KEY
        sync: false
      - key: MOYASAR_WEBHOOK_SECRET_TOKEN
        sync: false
      - key: MOYASAR_PUBLISHABLE_KEY
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: GO_SAUDI_CUSTOMER_ENCRYPTION_KEY
        sync: false
